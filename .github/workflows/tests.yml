name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # 3.9 的官方构建只发布到 Ubuntu 22.04/24.04，ubuntu-latest 已到 26.04，需按其固定镜像
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.11"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v
